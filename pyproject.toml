[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lensless-holography-workbench"
version = "0.3.1"
description = "Deterministic lensless hologram depth scans with a Windows desktop shell"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3,<3",
  "Pillow>=13,<14",
]

[project.optional-dependencies]
windows-release = [
  "PyInstaller==6.22.3",
  "pyinstaller-hooks-contrib==2026.10",
]

[project.scripts]
holography-workbench = "lensless_holography_workbench.cli:main"

[project.gui-scripts]
holography-workbench-gui = "lensless_holography_workbench.windows_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

